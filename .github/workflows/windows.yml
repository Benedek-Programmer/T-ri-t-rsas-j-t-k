name: Windows EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: |
          New-Item -ItemType Directory -Force -Path input
          Copy-Item Jatek.jar -Destination input\
          jpackage --input input --name "WWI_Tarsasjatek" --main-jar Jatek.jar --main-class Main --type app-image
          Compress-Archive -Path WWI_Tarsasjatek -DestinationPath WWI_Tarsasjatek-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WWI_Tarsasjatek-Windows
          path: WWI_Tarsasjatek-Windows.zip
